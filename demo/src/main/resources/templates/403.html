<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>403 - Accès Refusé</title>
    <style>
        body {
            background-color: #f8d7da;
            color: #721c24;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-top: 10%;
        }
        .container {
            background: #fff;
            padding: 3em 2em;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            display: inline-block;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }
        .icon {
            font-size: 5em;
            margin-bottom: 20px;
            color: #dc3545;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 32px;
        }
        a {
            color: #721c24;
            text-decoration: underline;
        }
        a:hover {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚫</div>
        <h1>403</h1>
        <h2>Accès refusé</h2>
        <p>Vous n'êtes pas autorisé à accéder à cette page.<br>
            Si vous pensez qu'il s'agit d'une erreur, veuillez contacter l'administrateur.</p>
        <a href="/">Retour à l'accueil</a>
    </div>
</body>
</html>
